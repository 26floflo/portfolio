<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume | Flourish Graphics</title>
    <!-- Google Font: Quicksand -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            font-family: 'Quicksand', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #ffffff;
            color: #333333;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Navigation Bar */
        nav {
            width: 100%;
            height: 54px;
            background: #ffffff;
            padding: 0 24px;
            border-bottom: 1px solid #eaeaea;
            display: flex;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav a {
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            text-decoration: none;
            color: #276661; /* Dark Green */
            transition: color 0.2s ease, opacity 0.2s ease;
        }

        nav a:hover {
            color: #1e4f4b;
            opacity: 0.85;
            text-decoration: underline;
        }

        /* SVG Display Container */
        .resume-container {
            width: 100%;
            max-width: 900px;
            padding: 32px 20px;
            display: flex;
            justify-content: center;
        }

        .resume-image {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 4px;
            background-color: #ffffff;
        }

        /* Mobile Screen Fitting */
        @media (max-width: 768px) {
            nav {
                height: 48px;
                padding: 0 16px;
            }

            .resume-container {
                padding: 16px 12px;
            }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">&larr; Back to Portfolio</a>
    </nav>

    <div class="resume-container">
        <img src="resume.svg" alt="Resume" class="resume-image">
    </div>

</body>
</html>
