<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume | Flourish Graphics</title>
    <!-- Google Font: Quicksand -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Quicksand', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #ffffff; /* Clean white background */
            color: #333;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        /* Top Navigation */
        nav {
            width: 100%;
            height: 54px;
            background: #ffffff;
            padding: 0 24px;
            border-bottom: 1px solid #eaeaea; /* Subtle light divider */
            display: flex;
            align-items: center;
            z-index: 10;
            flex-shrink: 0;
        }

        nav a {
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            text-decoration: none;
            color: #276661; /* Dark Green */
            transition: color 0.2s ease, opacity 0.2s ease;
        }

        nav a:hover {
            color: #1e4f4b;
            opacity: 0.85;
            text-decoration: underline;
        }

        /* PDF Viewer Container */
        .pdf-container {
            width: 100%;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
            background-color: #ffffff;
            height: calc(100vh - 54px);
        }

        .pdf-frame-wrapper {
            width: 100%;
            max-width: 960px;
            height: 100%;
            background: #ffffff;
            border: none;
            overflow: hidden;
            -webkit-overflow-scrolling: touch;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background-color: #ffffff;
        }

        /* Responsive Mobile Handling */
        @media (max-width: 768px) {
            nav {
                height: 48px;
                padding: 0 16px;
            }

            .pdf-container {
                height: calc(100vh - 48px);
            }

            .pdf-frame-wrapper {
                height: 100%;
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">&larr; Back to Portfolio</a>
    </nav>

    <div class="pdf-container">
        <div class="pdf-frame-wrapper">
            <!-- Google Docs PDF Viewer with light theme container -->
            <iframe 
                src="https://docs.google.com/gview?url=https://flourish-graphics.com/resume.pdf&embedded=true" 
                title="Resume PDF">
            </iframe>
        </div>
    </div>

</body>
</html>
